parameters:
  name: ''
  targetArchitecture: null
  skipTests: false
  timeoutInMinutes: 120
  enableMicrobuild: true
  enablePublishBuildArtifacts: true
  enablePublishTestResults: true
  enablePublishBuildAssets: true
  enablePublishUsingPipelines: true
  # Opt in only on agents provisioned with the matching prototype Core/Desktop runtime train.
  templateLifecycleTests: false
  templatePerformanceTests: false

jobs:
  - job: ${{ parameters.name }}
    displayName: ${{ parameters.name }}
    timeoutInMinutes: ${{ parameters.timeoutInMinutes }}
    variables:
    - name: _SkipTests
      value: ${{ parameters.skipTests }}
    - template: /eng/common/templates/variables/pool-providers.yml
    pool:
      ${{ if eq(variables['System.TeamProject'], 'public') }}:
        name: $(DncEngPublicBuildPool)
        demands: ImageOverride -equals windows.vs2026preview.scout.amd64.open
      ${{ if ne(variables['System.TeamProject'], 'public') }}:
        name: $(DncEngInternalBuildPool)
        demands: ImageOverride -equals windows.vs2026preview.scout.amd64
    strategy:
      matrix:
        Debug:
          _BuildConfig: Debug
          # override some variables for debug
          _SignType: test
          # Only collect coverage for external Debug-x64 builds. Uploads fail on internal builds, and coverage
          # collection on additional legs produces unnecessary performance overhead.
          ${{ if and(eq(variables['System.TeamProject'], 'public'), eq(parameters.targetArchitecture, 'x64')) }}:
            _Coverage: true
          ${{ else }}:
            _Coverage: false
        Release:
          _BuildConfig: Release
          _Coverage: false
    workspace:
      clean: all

    steps:
    - template: /eng/common/templates/steps/enable-internal-sources.yml
    - template: /eng/common/templates/steps/enable-internal-runtimes.yml

    - ${{ if ne(variables['System.TeamProject'], 'public') }}:
      - task: MicroBuildSigningPlugin@4
        displayName: Install MicroBuild plugin for Signing
        inputs:
          signType: $(_SignType)
          zipSources: false
          feedSource: https://dnceng.pkgs.visualstudio.com/_packaging/MicroBuildToolset/nuget/v3/index.json
        continueOnError: false
        condition: and(succeeded(), 
                       in(variables['_SignType'], 'real', 'test'))
    # NuGet's http cache lasts 30 minutes. If we're on a static machine, this may interfere with
    # auto-update PRs by preventing the CI build from fetching the new version. Delete the cache.
    - powershell: Remove-Item -Recurse -ErrorAction Ignore "$env:LocalAppData\NuGet\v3-cache"
      displayName: Clear NuGet http cache (if exists)

    - script: C:\Windows\Microsoft.NET\Framework\v4.0.30319\ngen.exe queue pause
      displayName: Pause NGEN x86

    - script: C:\Windows\Microsoft.NET\Framework64\v4.0.30319\ngen.exe queue pause
      displayName: Pause NGEN x64

    # Build and rename binlog
    # The /p:Coverage argument is passed here since some build properties change to accommodate running with
    # coverage. This is part of the workarounds for https://github.com/tonerdo/coverlet/issues/362 and
    # https://github.com/tonerdo/coverlet/issues/363.
    - script: eng\cibuild.cmd
        -restore
        -build
        -configuration $(_BuildConfig)
        /p:Platform=${{ parameters.targetArchitecture }}
        /p:TargetArchitecture=${{ parameters.targetArchitecture }}
        $(_OfficialBuildIdArgs)
        $(_InternalRuntimeDownloadArgs)
        /p:Coverage=$(_Coverage)
        /bl:$(BUILD.SOURCESDIRECTORY)\artifacts\log\$(_BuildConfig)\BuildSrc-${{ parameters.targetArchitecture }}.binlog
      displayName: Build

    # Run Unit Tests
    # Tests are run with /m:1 to work around https://github.com/tonerdo/coverlet/issues/364
    - script: eng\cibuild.cmd
        -test
        -configuration $(_BuildConfig)
        /p:Platform=${{ parameters.targetArchitecture }}
        /p:TargetArchitecture=${{ parameters.targetArchitecture }}
        $(_OfficialBuildIdArgs)
        $(_InternalRuntimeDownloadArgs)
        /p:Coverage=$(_Coverage)
        /p:TestRunnerAdditionalArguments='--filter-not-trait Category=IgnoreForCI --filter-not-trait Category=failing --ignore-exit-code 8'
        /bl:$(BUILD.SOURCESDIRECTORY)\artifacts\log\$(_BuildConfig)\Test-${{ parameters.targetArchitecture }}.binlog
        /m:1
      displayName: Run Unit Tests
      condition: and(eq(variables['System.TeamProject'], 'public'), ne('${{ parameters.targetArchitecture }}', 'arm64'), ne(variables['_SkipTests'], 'true'))

    # Run Integration Tests
    # Tests are run with /m:1 to avoid parallelism across different assemblies which can lead to
    # UI race conditions
    - script: eng\cibuild.cmd
        -integrationTest
        -configuration $(_BuildConfig)
        /p:Platform=${{ parameters.targetArchitecture }}
        /p:TargetArchitecture=${{ parameters.targetArchitecture }}
        $(_OfficialBuildIdArgs)
        $(_InternalRuntimeDownloadArgs)
        /p:Coverage=$(_Coverage)
        /p:TestRunnerAdditionalArguments='--filter-not-trait Category=IgnoreForCI --filter-not-trait Category=failing'
        /bl:$(BUILD.SOURCESDIRECTORY)\artifacts\log\$(_BuildConfig)\IntegrationTest-${{ parameters.targetArchitecture }}.binlog
        /m:1
      env:
        XUNIT_LOGS: $(BUILD.SOURCESDIRECTORY)\artifacts\log\$(_BuildConfig)
      displayName: Run Integration Tests
      condition: and(eq(variables['System.TeamProject'], 'public'), ne('${{ parameters.targetArchitecture }}', 'arm64'), ne(variables['_SkipTests'], 'true'))

    # Create Nuget package, sign, and publish
    - script: eng\cibuild.cmd
        -restore
        -pack
        -sign $(_SignArgs)
        -publish $(_PublishArgs)
        -configuration $(_BuildConfig)
        $(_OfficialBuildIdArgs)
        $(_InternalRuntimeDownloadArgs)
        /bl:$(BUILD.SOURCESDIRECTORY)\artifacts\log\$(_BuildConfig)\PackSignPublish-${{ parameters.targetArchitecture }}.binlog
      displayName: Pack, Sign, and Publish
      condition: eq('${{ parameters.targetArchitecture }}', 'x64')

    - ${{ if and(parameters.templateLifecycleTests, eq(parameters.targetArchitecture, 'x64')) }}:
      - task: PowerShell@2
        displayName: Validate Application Builder template lifecycle
        condition: and(succeeded(), eq(variables['_BuildConfig'], 'Debug'), ne(variables['_SkipTests'], 'true'))
        timeoutInMinutes: 45
        inputs:
          pwsh: true
          targetType: inline
          script: |
            $packages = @(Get-ChildItem 'artifacts\packages\Debug\NonShipping' -Filter 'Microsoft.Dotnet.WinForms.ProjectTemplates.*.nupkg')
            if ($packages.Count -ne 1) { throw 'Expected exactly one freshly packed template artifact.' }
            & '.\pkg\Microsoft.Dotnet.WinForms.ProjectTemplates\tests\Test-TemplateLifecycle.ps1' `
              -TemplatePackage $packages[0].FullName `
              -HostingPackageDirectory 'artifacts\packages\Debug\Shipping' `
              -PrototypeWinFormsDirectory 'artifacts\bin\System.Windows.Forms\Debug\net12.0' `
              -OutputRoot 'artifacts\log\Debug\TemplateLifecycle'
      - task: PublishTestResults@2
        displayName: Publish template lifecycle results
        condition: and(succeededOrFailed(), eq(variables['_BuildConfig'], 'Debug'), ne(variables['_SkipTests'], 'true'))
        inputs:
          testResultsFormat: JUnit
          testResultsFiles: 'artifacts/log/Debug/TemplateLifecycle/**/results.xml'
          failTaskOnFailedTests: true
          failTaskOnMissingResultsFile: true

    - ${{ if and(parameters.templatePerformanceTests, eq(parameters.targetArchitecture, 'x64')) }}:
      - task: PowerShell@2
        displayName: Measure Release Application Builder template performance
        condition: and(succeeded(), eq(variables['_BuildConfig'], 'Release'), ne(variables['_SkipTests'], 'true'))
        timeoutInMinutes: 60
        inputs:
          pwsh: true
          targetType: inline
          script: |
            & '.\build.cmd' -projects 'pkg\Microsoft.Dotnet.WinForms.ProjectTemplates\tests\PerformanceDriver\TemplatePerformanceDriver.csproj' `
              -configuration Release -verbosity minimal
            if ($LASTEXITCODE -ne 0) { throw 'Performance observer build failed.' }
            $packages = @(Get-ChildItem 'artifacts\packages\Release\NonShipping' -Filter 'Microsoft.Dotnet.WinForms.ProjectTemplates.*.nupkg')
            if ($packages.Count -ne 1) { throw 'Expected exactly one freshly packed template artifact.' }
            $root = Join-Path $PWD 'artifacts\log\Release\TemplatePerformance'
            & '.\pkg\Microsoft.Dotnet.WinForms.ProjectTemplates\tests\Test-TemplateLifecycle.ps1' `
              -TemplatePackage $packages[0].FullName `
              -HostingPackageDirectory 'artifacts\packages\Release\Shipping' `
              -PrototypeWinFormsDirectory 'artifacts\bin\System.Windows.Forms\Release\net12.0' `
              -RuntimeIdentifiers win-x64 -OutputRoot (Join-Path $root 'lifecycle')
            $runs = @(Get-ChildItem (Join-Path $root 'lifecycle') -Directory)
            if ($runs.Count -ne 1) { throw 'Expected one successful lifecycle source run.' }
            & '.\pkg\Microsoft.Dotnet.WinForms.ProjectTemplates\tests\Measure-TemplatePerformance.ps1' `
              -LifecycleOutput $runs[0].FullName `
              -HostingPackageDirectory 'artifacts\packages\Release\Shipping' `
              -PrototypeWinFormsDirectory 'artifacts\bin\System.Windows.Forms\Release\net12.0' `
              -Driver 'artifacts\bin\TemplatePerformanceDriver\Release\net12.0\TemplatePerformanceDriver.exe' `
              -OutputRoot $root -Repeats 2 -Warmup 1

    # Upload code coverage data
    - script: $(Build.SourcesDirectory)/.dotnet/dotnet msbuild -restore
        eng/CodeCoverage.proj
        /p:Configuration=$(_BuildConfig)
        $(_InternalRuntimeDownloadArgs)
        /bl:$(BUILD.SOURCESDIRECTORY)\artifacts\log\$(_BuildConfig)\CodeCoverage-${{ parameters.targetArchitecture }}.binlog
      displayName: Upload coverage to codecov.io
      condition: and(succeeded(), eq(variables._Coverage, 'true'), eq('${{ parameters.targetArchitecture }}', 'x64'))

    #Publish code coverage results
    - task: PublishCodeCoverageResults@2
      inputs:
        summaryFileLocation: '$(Build.SourcesDirectory)\artifacts\bin\CodeCoverage\coverage\full\Cobertura.xml'
        pathToSources: '$(Build.SourcesDirectory)'
      displayName: PublishCodeCoverageResults
      condition: and(eq(variables['_BuildConfig'], 'Debug'), eq('${{ parameters.targetArchitecture }}', 'x64'))

    - template: post-build-PR.yml
      parameters:
        name: ${{ parameters.name }}
        targetArchitecture: ${{ parameters.targetArchitecture }}
